<!DOCTYPE html><html><head><meta charset="utf-8">
<style>

html,body{margin:0;width:1200px;height:1200px}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:62px;background:linear-gradient(150deg,#2C2A51,#221F40);text-align:center;position:relative;overflow:hidden}

img{width:1060px;position:relative;z-index:1}
p{position:relative;z-index:1;margin:0;font:700 21px "Gontserrat",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#F2C386}
